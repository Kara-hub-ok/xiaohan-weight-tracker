<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小涵的减重记录 🌿</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2e9 0%, #f0e6f6 30%, #e6f0fa 60%, #e8f5e9 100%);
    background-attachment: fixed;
    color: #2d3436;
    padding: 16px;
    max-width: 800px;
    margin: 0 auto;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 20% 20%, rgba(120, 200, 150, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(180, 140, 220, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(100, 180, 255, 0.08) 0%, transparent 50%);
    z-index: -1;
    animation: float 20s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(20px, -20px) rotate(1deg); }
    66% { transform: translate(-10px, 15px) rotate(-1deg); }
  }

  h1 {
    text-align: center;
    margin: 20px 0;
    font-size: 1.6em;
    font-weight: 700;
    background: linear-gradient(135deg, #4a7c59, #6bb386, #4a7c59);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .glass {
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .glass-strong {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat-card {
    padding: 16px 10px;
    text-align: center;
    transition: transform 0.2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card .label { font-size: 0.78em; color: #888; font-weight: 500; letter-spacing: 0.5px; }
  .stat-card .value {
    font-size: 1.6em;
    font-weight: 800;
    margin-top: 4px;
    background: linear-gradient(135deg, #3d8b5e, #5ab77e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card .value.accent {
    background: linear-gradient(135deg, #e74c3c, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card .sub { font-size: 0.72em; color: #aaa; margin-top: 3px; }

  .chart-container { position: relative; padding: 20px 16px; margin: 16px 0; overflow: hidden; }
  .chart-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  /* 横向查看时固定在左侧的体重刻度 */
  .chart-y-axis { position: absolute; top: 20px; bottom: 28px; left: 16px; width: 42px; z-index: 3; pointer-events: none; background: rgba(255,255,255,0.78); border-radius: 8px; box-shadow: 5px 0 10px rgba(255,255,255,0.55); }
  .chart-y-axis-title { position: absolute; top: 1px; left: 0; width: 100%; text-align: center; font-size: 10px; color: #777; }
  .chart-y-axis-tick { position: absolute; right: 4px; transform: translateY(-50%); font-size: 10px; color: #777; line-height: 1; white-space: nowrap; }
  .chart-scroll-inner { min-width: max(620px, calc(var(--chart-points, 1) * 12px)); height: 230px; }
  .chart-scroll canvas { height: 220px !important; }
  .chart-scroll-hint { margin: 10px 0 0; text-align: center; font-size: 0.75em; color: #888; }
  @media (min-width: 768px) {
    .chart-scroll-inner { min-width: 100%; }
    .chart-scroll-hint { display: none; }
  }

  .section-title {
    font-size: 1.05em;
    font-weight: 700;
    color: #4a7c59;
    margin: 24px 0 12px;
    letter-spacing: 0.5px;
  }

  .weekly { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
  .week-card { padding: 14px; text-align: center; transition: transform 0.2s ease; }
  .week-card:hover { transform: translateY(-2px); }
  .week-card .wk { font-size: 0.78em; color: #888; }
  .week-card .wv {
    font-size: 1.3em; font-weight: 800;
    background: linear-gradient(135deg, #3d8b5e, #5ab77e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin: 4px 0;
  }

  .table-wrap { padding: 0; overflow: hidden; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: linear-gradient(135deg, rgba(74, 124, 89, 0.85), rgba(93, 156, 112, 0.85));
    backdrop-filter: blur(10px);
    color: #fff; padding: 12px 8px; font-size: 0.82em; text-align: center; font-weight: 600; letter-spacing: 0.5px;
  }
  td { padding: 10px 8px; text-align: center; font-size: 0.84em; border-bottom: 1px solid rgba(0,0,0,0.04); background: transparent; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(74, 124, 89, 0.04); }

  .weight-down { color: #27ae60; font-weight: 700; }
  .weight-up { color: #e74c3c; font-weight: 700; }
  .weight-same { color: #aaa; }
  .injection td { background: rgba(255, 215, 0, 0.08); }
  .exercise-tag {
    display: inline-block;
    background: linear-gradient(135deg, rgba(74,124,89,0.12), rgba(107,179,134,0.15));
    color: #3d7a52; padding: 3px 8px; border-radius: 8px; font-size: 0.75em; font-weight: 500;
    border: 1px solid rgba(74,124,89,0.1);
  }

  .footer { text-align: center; color: #bbb; font-size: 0.72em; margin: 24px 0; letter-spacing: 0.5px; }

  /* Fun facts modal */
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:100; justify-content:center; align-items:center; }
  .modal-overlay.show { display:flex; }
  .modal-box { background:rgba(255,255,255,0.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.7); border-radius:20px; box-shadow:0 12px 48px rgba(0,0,0,0.15); padding:28px 24px; max-width:340px; width:90%; text-align:center; animation:modalIn 0.3s ease; }
  @keyframes modalIn { from { transform:scale(0.85); opacity:0; } to { transform:scale(1); opacity:1; } }
  .modal-box .modal-title { font-size:1.3em; font-weight:800; background:linear-gradient(135deg,#3d8b5e,#5ab77e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:16px; }
  .modal-box .fun-item { padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.05); }
  .modal-box .fun-item:last-child { border-bottom:none; }
  .modal-box .fun-emoji { font-size:1.8em; }
  .modal-box .fun-text { font-size:0.88em; color:#2d3436; margin-top:4px; font-weight:500; }
  .modal-box .fun-sub { font-size:0.75em; color:#999; }
  .modal-close { margin-top:18px; background:linear-gradient(135deg,#4a7c59,#6bb386); color:#fff; border:none; padding:8px 28px; border-radius:12px; font-size:0.88em; font-weight:600; cursor:pointer; }

  .progress-wrap { margin: 16px 0; padding: 16px 20px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #888; margin-bottom: 8px; }
  .progress-bar { height: 10px; border-radius: 10px; background: rgba(0,0,0,0.06); overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, #6bb386, #4a7c59, #3d8b5e);
    transition: width 1s ease; box-shadow: 0 2px 8px rgba(74,124,89,0.3);
  }

  /* Tabs */
  .tabs { display: flex; border-radius: 16px 16px 0 0; overflow: hidden; margin-top: 24px; margin-bottom: 0; }
  .tab { flex: 1; text-align: center; padding: 14px; font-size: 0.9em; font-weight: 600; color: #4a7c59; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.3); }
  .tab.active { background: rgba(255,255,255,0.6); color: #3d8b5e; border-bottom: 2px solid #4a7c59; }
  .tab:not(.active):hover { background: rgba(255,255,255,0.45); }
  .tab-content { margin-bottom: 20px; }

  /* Carousel */
  .carousel-wrap { position: relative; overflow: hidden; margin: 10px 0; }
  .carousel-track { display: flex; transition: transform 0.35s ease; touch-action: pan-y; }
  .carousel-card { min-width: 100%; box-sizing: border-box; padding: 16px; }
  .carousel-card .cc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .carousel-card .cc-meal { font-size: 1em; font-weight: 700; color: #4a7c59; }
  .carousel-card .cc-cal { font-size: 0.9em; font-weight: 600; color: #3d8b5e; }
  .carousel-card .cc-items { margin-bottom: 10px; }
  .carousel-card .cc-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.85em; color: #2d3436; border-bottom: 1px solid rgba(74,124,89,0.06); }
  .carousel-card .cc-item:last-child { border-bottom: none; }
  .carousel-card .cc-macros { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .carousel-card .cc-macros span { background: rgba(74,124,89,0.08); padding: 3px 10px; border-radius: 8px; font-size: 0.78em; color: #4a7c59; font-weight: 500; }
  .carousel-dots { display: flex; justify-content: center; gap: 8px; padding: 12px 0; }
  .carousel-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(74,124,89,0.2); cursor: pointer; transition: all 0.2s; }
  .carousel-dots .dot.active { background: #4a7c59; transform: scale(1.3); }
  .carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: rgba(74,124,89,0.15); border: none; color: #4a7c59; font-size: 1.1em; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 2; }
  .carousel-nav:hover { background: rgba(74,124,89,0.3); }
  .carousel-nav.prev { left: 6px; }
  .carousel-nav.next { right: 6px; }
  .no-meals { text-align: center; padding: 30px; color: #888; font-size: 0.9em; }

  /* Diet history */
  .diet-day { margin: 8px 0; padding: 0; overflow: hidden; }
  .diet-day-header { font-size: 0.9em; font-weight: 600; color: #4a7c59; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .diet-day-header .day-cal { font-size: 0.85em; color: #3d8b5e; font-weight: 600; }
  .diet-day-header .toggle-icon { font-size: 0.8em; color: #4a7c59; transition: transform 0.2s; }
  .diet-day-header .toggle-icon.open { transform: rotate(90deg); }
  .diet-day-body { display: none; padding: 0 16px 16px; }


  /* Visual iteration: refined, editorial, quiet */
  :root { --ink:#1f2923; --muted:#788078; --line:#e7ebe5; --green:#345f48; --green-soft:#edf4ef; --paper:#fcfcfa; --warm:#f5f5f0; }
  body { max-width: 920px; padding: 34px 20px 48px; background: var(--warm); color: var(--ink); }
  body::before { display:none; }
  h1 { margin: 8px 0 30px; text-align:left; font-size:clamp(1.6rem, 4vw, 2.1rem); line-height:1.15; letter-spacing:-0.045em; color:var(--ink); background:none; -webkit-text-fill-color:currentColor; }
  .glass, .glass-strong { background:rgba(255,255,253,.9); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(30,43,34,.035); backdrop-filter:none; -webkit-backdrop-filter:none; }
  .stats { gap:10px; margin:10px 0; }
  .stat-card { padding:17px 10px 15px; }
  .stat-card:hover, .week-card:hover { transform:none; }
  .stat-card .label, .week-card .wk { color:var(--muted); font-size:.72rem; font-weight:600; letter-spacing:.055em; }
  .stat-card .value, .week-card .wv { margin-top:6px; color:var(--ink); background:none; -webkit-text-fill-color:currentColor; font-size:1.45rem; letter-spacing:-.045em; }
  .stat-card .value.accent { color:var(--green); background:none; -webkit-text-fill-color:currentColor; }
  .stat-card .sub { color:#9ba19b; font-size:.71rem; margin-top:4px; }
  .progress-wrap { margin:18px 0 28px; padding:16px 18px; }
  .progress-label { color:var(--muted); font-size:.72rem; margin-bottom:9px; }
  .progress-bar { height:6px; background:#e8ece7; }
  .progress-fill { background:var(--green); box-shadow:none; }
  .chart-container { padding:21px 18px 14px; margin:0 0 30px; }
  .chart-y-axis { left:18px; top:21px; bottom:29px; background:rgba(255,255,253,.96); box-shadow:5px 0 10px rgba(255,255,253,.8); }
  .chart-scroll-hint { color:#9ba19b; font-size:.7rem; }
  .section-title { margin:30px 0 10px; color:var(--ink); font-size:.9rem; letter-spacing:.02em; }
  .weekly { gap:10px; margin:0; }
  .week-card { padding:15px; }
  .table-wrap { margin-bottom:28px; }
  th { background:var(--green); padding:11px 8px; font-size:.72rem; letter-spacing:.04em; }
  td { padding:11px 8px; font-size:.8rem; border-bottom-color:var(--line); }
  tr:hover td { background:var(--green-soft); }
  .injection td { background:#fff9e8; }
  .exercise-tag { color:var(--green); background:var(--green-soft); border:0; border-radius:999px; font-size:.7rem; padding:4px 8px; }
  .tabs { margin-top:30px; border-radius:14px 14px 0 0; border-bottom:1px solid var(--line); }
  .tab { background:transparent; color:var(--muted); font-size:.82rem; padding:13px; }
  .tab.active { background:var(--paper); color:var(--green); border-bottom:2px solid var(--green); }
  .tab:not(.active):hover { background:var(--green-soft); }
  .today-summary { margin:0 0 10px !important; }
  .carousel-wrap, .diet-day { margin:0 0 10px; }
  .carousel-card .cc-meal, .carousel-card .cc-cal, .diet-day-header, .diet-day-header .day-cal { color:var(--green); }
  .carousel-card .cc-macros span { background:var(--green-soft); color:var(--green); border-radius:999px; }
  .carousel-dots .dot.active { background:var(--green); }
  .carousel-nav { background:var(--green-soft); color:var(--green); }
  .modal-box { background:var(--paper); border-color:var(--line); box-shadow:0 20px 60px rgba(30,43,34,.16); }
  .modal-box .modal-title { color:var(--ink); background:none; -webkit-text-fill-color:currentColor; }
  .modal-close { background:var(--green); border-radius:9px; }
  .footer { margin:32px 0 0; color:#a4aaa4; }
  @media (max-width: 520px) { body { padding:24px 14px 36px; } h1 { margin:6px 2px 24px; } .stats { gap:7px; } .stat-card { padding:14px 5px 12px; } .stat-card .value { font-size:1.25rem; } .chart-container { padding:16px 12px 12px; } .chart-y-axis { left:12px; top:16px; } }

</style>
</head>
<body>

<h1>🌿 小涵的减重记录</h1>

<div class="stats">
  <div class="stat-card glass"><div class="label">起始体重</div><div class="value" id="startW">--</div><div class="sub" id="startDate"></div></div>
  <div class="stat-card glass"><div class="label">今日体重</div><div class="value" id="currentW">--</div><div class="sub" id="currentDate"></div></div>
  <div class="stat-card glass" id="lossCard" style="cursor:pointer"><div class="label">已减</div><div class="value" id="totalLoss">--</div><div class="sub" id="totalDays"></div></div>
</div>
<div class="stats">
  <div class="stat-card glass" id="goalCard" style="cursor:pointer"><div class="label">下一目标</div><div class="value accent" id="goalW">56.0</div><div class="sub">6月16日前</div></div>
  <div class="stat-card glass"><div class="label">距目标</div><div class="value accent" id="toGoal">--</div><div class="sub">还差</div></div>
  <div class="stat-card glass"><div class="label">周均减重</div><div class="value" id="weeklyAvg">--</div><div class="sub">kg/周</div></div>
</div>

<div class="progress-wrap glass">
  <div class="progress-label"><span id="pStart">70.0</span><span id="pPercent">0%</span><span id="pGoal">62.0</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
</div>

<div class="chart-container glass-strong">
  <div class="chart-scroll" id="chartScroll" aria-label="体重趋势图，可左右滑动查看">
    <div class="chart-scroll-inner" id="chartScrollInner">
      <canvas id="weightChart"></canvas>
    </div>
  </div>
  <div class="chart-y-axis" id="chartYAxis" aria-hidden="true"></div>
  <div class="chart-scroll-hint">← 左右滑动查看完整趋势 →</div>
</div>

<div class="section-title">📊 每周汇总</div>
<div class="weekly" id="weeklyCards"></div>
<div style="text-align:center;margin:8px 0 16px;">
  <button id="weeklyToggle" onclick="toggleWeekly()" style="background:none;border:1px solid rgba(74,124,89,0.25);color:#4a7c59;padding:6px 18px;border-radius:10px;font-size:0.82em;cursor:pointer;font-weight:500;transition:all 0.2s;">展开全部</button>
</div>

<div class="section-title">📅 每月汇总</div>
<div class="weekly" id="monthlyCards"></div>

<div class="section-title">📋 每日明细</div>
<div class="table-wrap glass-strong">
<table>
  <thead><tr><th>日期</th><th>星期</th><th>体重</th><th>变化</th><th>运动</th><th>备注</th></tr></thead>
  <tbody id="tableBody"></tbody>
</table>
</div>

<div class="modal-overlay" id="funModal" onclick="this.classList.remove('show')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="funTitle"></div>
    <div id="funItems"></div>
    <button class="modal-close" onclick="document.getElementById('funModal').classList.remove('show')">知道了 💪</button>
  </div>
</div>

<div class="footer">姆姆医生 💚 为小涵定制</div>

const GOAL = 56.0;
const ULTIMATE_GOAL = 50.0;
const MILESTONES = [
  { kg: 65.0, by: '-', done: true, doneDate: '4/7' },
  { kg: 62.0, by: '4/30', done: true, doneDate: '4/26' },
  { kg: 59.0, by: '5/30', done: true, doneDate: '6/9' },
  { kg: 56.0, by: '6/16', done: false, doneDate: null },
  { kg: 50.0, by: '终极', done: false, doneDate: null },
];

// ===== 渲染逻辑 =====
const DAYS = ['日','一','二','三','四','五','六'];
function dayOfWeek(d) { return DAYS[new Date(d).getDay()]; }
function fmt(d) { return d.slice(5).replace('-','/'); }
function diffDays(a, b) { return Math.round((new Date(b)-new Date(a))/86400000); }

const withWeight = DATA.filter(d => d.weight !== null);
const first = withWeight[0];
const last = withWeight[withWeight.length - 1];
const days = diffDays(first.date, last.date);
const loss = first.weight - last.weight;
const weeks = days / 7 || 1;

document.getElementById('startW').textContent = first.weight.toFixed(1);
document.getElementById('startDate').textContent = fmt(first.date);
document.getElementById('currentW').textContent = last.weight.toFixed(1);
document.getElementById('currentDate').textContent = fmt(last.date);
document.getElementById('totalLoss').textContent = '-' + loss.toFixed(1) + 'kg';
document.getElementById('totalDays').textContent = days + '天';
document.getElementById('toGoal').textContent = (last.weight - GOAL).toFixed(1) + 'kg';
document.getElementById('weeklyAvg').textContent = (loss / weeks).toFixed(2);

const totalToLose = first.weight - GOAL;
const pct = Math.min(100, (loss / totalToLose * 100)).toFixed(0);
document.getElementById('pStart').textContent = first.weight.toFixed(1);
document.getElementById('pGoal').textContent = GOAL.toFixed(1);
document.getElementById('pPercent').textContent = pct + '%';
setTimeout(() => { document.getElementById('progressFill').style.width = pct + '%'; }, 100);

// Chart
const chartLabels = withWeight.map(d => fmt(d.date));
const chartData = withWeight.map(d => d.weight);
const chartScrollInner = document.getElementById('chartScrollInner');
chartScrollInner.style.setProperty('--chart-points', chartLabels.length);
const chartCanvas = document.getElementById('weightChart');
const gradient = chartCanvas.getContext('2d');
const gFill = gradient.createLinearGradient(0, 0, 0, 300);
gFill.addColorStop(0, 'rgba(74, 124, 89, 0.25)');
gFill.addColorStop(1, 'rgba(74, 124, 89, 0.02)');

const weightChart = new Chart(chartCanvas, {
  type: 'line',
  data: {
    labels: chartLabels,
    datasets: [
      {
        label: '体重 (kg)', data: chartData,
        borderColor: '#4a7c59', backgroundColor: gFill, fill: true, tension: 0.4, borderWidth: 2.5,
        pointBackgroundColor: withWeight.map(d => d.note && d.note.includes('💉') ? '#e74c3c' : '#fff'),
        pointBorderColor: withWeight.map(d => d.note && d.note.includes('💉') ? '#e74c3c' : '#4a7c59'),
        pointBorderWidth: 2,
        pointRadius: withWeight.map(d => d.note && d.note.includes('💉') ? 6 : 3.5),
        pointHoverRadius: 8,
      },
      {
        label: '目标 ' + GOAL + 'kg',
        data: Array(chartLabels.length).fill(GOAL),
        borderColor: 'rgba(231, 76, 60, 0.4)', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, fill: false,
      },
      {
        label: '56kg (6/16)',
        data: Array(chartLabels.length).fill(56),
        borderColor: 'rgba(243, 156, 18, 0.35)', borderDash: [4, 4], borderWidth: 1, pointRadius: 0, fill: false,
      },
      {
        label: '终极目标 ' + ULTIMATE_GOAL + 'kg',
        data: Array(chartLabels.length).fill(ULTIMATE_GOAL),
        borderColor: 'rgba(155, 89, 182, 0.35)', borderDash: [3, 3], borderWidth: 1, pointRadius: 0, fill: false,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: true, position: 'top', labels: { font: { size: 11 }, usePointStyle: true, padding: 16 } },
      tooltip: {
        backgroundColor: 'rgba(255,255,255,0.9)', titleColor: '#333', bodyColor: '#555',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1, cornerRadius: 10, padding: 12,
        callbacks: {
          afterLabel: function(ctx) {
            if (ctx.datasetIndex === 0) {
              const d = withWeight[ctx.dataIndex];
              let s = '';
              if (d.exercise) s += '🏃 ' + d.exercise;
              if (d.note) s += (s ? '\n' : '') + d.note;
              return s;
            }
          }
        }
      }
    },
    layout: { padding: { left: 42 } },
    scales: {
      y: { min: Math.floor(GOAL - 1), max: Math.ceil(first.weight + 0.5), ticks: { display: false }, grid: { color: 'rgba(0,0,0,0.04)' } },
      x: { ticks: { font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 }, grid: { display: false } }
    }
  }
});

// 体重刻度独立于横向滚动区域，始终固定在左侧
function renderStickyYAxis(chart) {
  const axis = document.getElementById('chartYAxis');
  const y = chart.scales.y;
  axis.innerHTML = '<span class="chart-y-axis-title">kg</span>';
  y.ticks.forEach(tick => {
    const el = document.createElement('span');
    el.className = 'chart-y-axis-tick';
    el.textContent = tick.value;
    el.style.top = y.getPixelForValue(tick.value) + 'px';
    axis.appendChild(el);
  });
}
renderStickyYAxis(weightChart);

// 默认定位到最新记录，移动端可向左滑动查看早期数据
requestAnimationFrame(() => {
  const chartScroll = document.getElementById('chartScroll');
  chartScroll.scrollLeft = chartScroll.scrollWidth;
});

// Weekly cards
// 按打针周期算周：周五到周四
function getWeekNum(dateStr) {
  const d = new Date(dateStr);
  // 调整：周五=0, 周六=1, ..., 周四=6
  const day = (d.getDay() + 2) % 7;
  const first = new Date(DATA[0].date);
  const firstDay = (first.getDay() + 2) % 7;
  const firstFri = new Date(first);
  firstFri.setDate(first.getDate() - firstDay);
  return Math.floor((d - firstFri) / (7 * 86400000));
}
const weekMap = {};
withWeight.forEach(d => { const wk = getWeekNum(d.date); if (!weekMap[wk]) weekMap[wk] = []; weekMap[wk].push(d); });
const weeklyEl = document.getElementById('weeklyCards');
const weekKeysSorted = Object.keys(weekMap).sort((a,b) => a-b);
const weekKeys = [...weekKeysSorted].reverse();
const SHOW_RECENT = 4;
let weeklyExpanded = false;

// 检查某周是否有打针
const injectionWeeks = {};
DATA.forEach(d => {
  if (d.note && d.note.includes('💉')) injectionWeeks[getWeekNum(d.date)] = d.note;
});

weekKeys.forEach((wk, i) => {
  const entries = weekMap[wk];
  // 用上一周最后一天的体重作为起始值
  const wkIdx = weekKeysSorted.indexOf(wk);
  const prevWk = wkIdx > 0 ? weekKeysSorted[wkIdx - 1] : null;
  const prevWkLast = prevWk ? weekMap[prevWk][weekMap[prevWk].length - 1].weight : null;
  const wStart = prevWkLast !== null ? prevWkLast : entries[0].weight;
  const wEnd = entries[entries.length-1].weight;
  const wLoss = wStart - wEnd;
  const card = document.createElement('div');
  card.className = 'week-card glass';
  if (weekKeys.length > SHOW_RECENT && i >= SHOW_RECENT) card.style.display = 'none';
  card.dataset.weekIdx = i;
  const needle = injectionWeeks[wk] ? ' 🪡' : '';
  card.innerHTML = `<div class="wk">第${parseInt(wk)+1}周${needle}</div><div class="wv">${wLoss >= 0 ? '-' : '+'}${Math.abs(wLoss).toFixed(1)}kg</div><div class="wk">${wStart.toFixed(1)} → ${wEnd.toFixed(1)}</div>`;
  weeklyEl.appendChild(card);
});

const weeklyToggleBtn = document.getElementById('weeklyToggle');
if (weekKeys.length <= SHOW_RECENT) weeklyToggleBtn.style.display = 'none';

function toggleWeekly() {
  weeklyExpanded = !weeklyExpanded;
  weeklyEl.querySelectorAll('.week-card').forEach((card, i) => {
    if (i >= SHOW_RECENT) card.style.display = weeklyExpanded ? '' : 'none';
  });
  weeklyToggleBtn.textContent = weeklyExpanded ? '收起' : '展开全部';
}

// Monthly cards
const monthMap = {};
withWeight.forEach(d => {
  const month = d.date.slice(0, 7); // YYYY-MM
  if (!monthMap[month]) monthMap[month] = [];
  monthMap[month].push(d);
});
const monthlyEl = document.getElementById('monthlyCards');
const monthNames = { '01':'一月','02':'二月','03':'三月','04':'四月','05':'五月','06':'六月','07':'七月','08':'八月','09':'九月','10':'十月','11':'十一月','12':'十二月' };
const sortedMonths = Object.keys(monthMap).sort();
sortedMonths.reverse().forEach((month, idx) => {
  const entries = monthMap[month];
  // 当月的起始体重：用上个月最后一天的体重（如果有）
  const sortedAll = Object.keys(monthMap).sort();
  const monthIdx = sortedAll.indexOf(month);
  const prevMonth = monthIdx > 0 ? sortedAll[monthIdx - 1] : null;
  const prevMonthLast = prevMonth ? monthMap[prevMonth][monthMap[prevMonth].length - 1].weight : null;
  const mStart = prevMonthLast !== null ? prevMonthLast : entries[0].weight;
  const mEnd = entries[entries.length-1].weight;
  const mLoss = mStart - mEnd;
  const mMin = Math.min(...entries.map(e => e.weight));
  const mMax = Math.max(...entries.map(e => e.weight));
  const card = document.createElement('div');
  card.className = 'week-card glass';
  const mm = month.split('-')[1];
  card.innerHTML = `<div class="wk">${monthNames[mm] || mm}</div><div class="wk" style="font-size:0.7em;color:#aaa;">${fmt(entries[0].date)} - ${fmt(entries[entries.length-1].date)}</div><div class="wv">${mLoss >= 0 ? '-' : '+'}${Math.abs(mLoss).toFixed(1)}kg</div><div class="wk">${mStart.toFixed(1)} → ${mEnd.toFixed(1)}</div><div class="wk" style="margin-top:2px;font-size:0.72em;color:#aaa;">最低 ${mMin.toFixed(1)} / 最高 ${mMax.toFixed(1)}</div>`;
  monthlyEl.appendChild(card);
});

// Table
const tbody = document.getElementById('tableBody');
let prevWeight = null;
DATA.forEach(d => {
  const tr = document.createElement('tr');
  if (d.note && d.note.includes('💉')) tr.className = 'injection';
  let changeHtml = '<span class="weight-same">-</span>';
  if (d.weight !== null) {
    if (prevWeight !== null) {
      const diff = d.weight - prevWeight;
      if (diff < 0) changeHtml = `<span class="weight-down">${diff.toFixed(1)}</span>`;
      else if (diff > 0) changeHtml = `<span class="weight-up">+${diff.toFixed(1)}</span>`;
      else changeHtml = `<span class="weight-same">0</span>`;
    }
    prevWeight = d.weight;
  }
  const exerciseHtml = d.exercise ? `<span class="exercise-tag">${d.exercise}</span>` : '';
  tr.innerHTML = `<td>${fmt(d.date)}</td><td>${dayOfWeek(d.date)}</td><td style="font-weight:600">${d.weight !== null ? d.weight.toFixed(1) : '-'}</td><td>${changeHtml}</td><td>${exerciseHtml}</td><td>${d.note || ''}</td>`;
  tbody.appendChild(tr);
});

// Fun facts modal
const funFacts = [
  { emoji: '💧', text: (kg) => `${(kg/0.55).toFixed(0)} 瓶农夫山泉`, sub: '标准550ml装' },
  { emoji: '💪', text: (kg,pct) => `减掉了 ${pct}% 的原来的自己`, sub: `从 ${first.weight}kg → ${last.weight}kg` },
];

document.getElementById('lossCard').addEventListener('click', () => {
  const lossKg = loss;
  const pct = (lossKg / first.weight * 100).toFixed(1);
  const modal = document.getElementById('funModal');
  const title = document.getElementById('funTitle');
  const items = document.getElementById('funItems');
  title.textContent = `你已经减掉了 ${lossKg.toFixed(1)}kg！`;
  items.innerHTML = funFacts.map(f => `<div class="fun-item"><div class="fun-emoji">${f.emoji}</div><div class="fun-text">${f.text(lossKg,pct)}</div><div class="fun-sub">${f.sub}</div></div>`).join('');
  modal.classList.add('show');
});

// Goal milestones modal
document.getElementById('goalCard').addEventListener('click', () => {
  const modal = document.getElementById('funModal');
  const title = document.getElementById('funTitle');
  const items = document.getElementById('funItems');
  title.textContent = '🎯 我的目标路线图';
  items.innerHTML = MILESTONES.map(m => {
    if (m.done) {
      return `<div class="fun-item"><div class="fun-emoji">✅</div><div class="fun-text">${m.kg}kg</div><div class="fun-sub">目标 ${m.by} · 实际 ${m.doneDate} 达成！</div></div>`;
    } else {
      const diff = (last.weight - m.kg).toFixed(1);
      return `<div class="fun-item"><div class="fun-emoji">⏳</div><div class="fun-text">${m.kg}kg</div><div class="fun-sub">目标 ${m.by} · 还差 ${diff}kg</div></div>`;
    }
  }).join('');
  modal.classList.add('show');
});
